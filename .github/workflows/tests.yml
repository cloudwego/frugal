name: Tests

on: [ push, pull_request ]

jobs:
  unittest-amd64:
    strategy:
      matrix:
        go: [ "1.20", oldstable, stable ]
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test packages
        # -race enables checkptr=1 unless it is set explicitly
        run: go test -race -gcflags=all=-d=checkptr=2 -timeout 2m ./...
      - name: Test ./tests & Benchmark
        run: cd tests && go test -timeout 2m -bench=. -benchmem -benchtime=100ms
      - name: Race check ./tests
        run: cd tests && go test -race -gcflags=all=-d=checkptr=2 -timeout 2m ./...
